openapi: 3.0.3
info:
  title: MobileApp API
  description: API for the mobile apps in the MORE platform
  version: '1'

servers:
  - url: /api/v1

tags:
  - name: Registration
    description: |
      Initial **registration** of a participant
  - name: Configuration
    description: Endpoints to retrieve **configuration settings** for the current participation
  - name: Data
    description: |
      Endpoints to **send** observation-data
  - name: Signup
    description: |
      Provides information about the study signup
  - name: GarminRegistration
    description: Endpoints to register for Garmin Connect using OAuth
  - name: AppApplications
    description: Endpoints to manage applications
  - name: Milestones
    description: |
      Endpoints to receive participant milestones

externalDocs:
  url: https://github.com/MORE-Platform

security:
  - apiKey: [ ]

paths:
  /signup:
    get:
      operationId: getSignupInfo
      description: Returns simple HTML study information identified by the required participant registration token
      tags:
        - Signup
      parameters:
        - $ref: '#/components/parameters/RegistrationTokenQuery'
      responses:
        '200':
          description: Simple study information in HTML
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '400':
          description: bad request, token missing or invalid
        '404':
          $ref: '#/components/responses/NoSuchRegistrationToken'
        '410':
          $ref: '#/components/responses/RegistrationTokenExpired'

  /registration:
    get:
      operationId: getStudyRegistrationInfo
      description: Provide the information on a study required to register and consent.
      tags:
        - Registration
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
      responses:
        '200':
          $ref: 'BaseComponents.yaml#/components/responses/StudyInfoResponse'
        '404':
          $ref: '#/components/responses/NoSuchRegistrationToken'
        '410':
          $ref: '#/components/responses/RegistrationTokenExpired'
    post:
      operationId: registerForStudy
      description: Perform the Registration to the Study and express the users consent.
      tags:
        - Registration
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/RegistrationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'BaseComponents.yaml#/components/schemas/StudyConsent'
      responses:
        '201':
          description: Consent given and ApiKey created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfiguration'
        '404':
          $ref: '#/components/responses/NoSuchRegistrationToken'
        '409':
          $ref: '#/components/responses/RegistrationNotPossible'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: unregisterFromStudy
      description: Leave study / Withdraw Consent
      tags:
        - Registration
      responses:
        '204':
          description: Participant left the study.

  /registration/garmin:
    get:
      operationId: getGarminOauthUrl
      description: redirect to the Garmin OAuth page
      tags:
        - GarminRegistration
      responses:
        '302':
          description: redirect to Garmin OAuth
          headers:
            Location:
              schema:
                type: string
              description: URL to the Garmin OAuth page
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'

  /registration/garmin/callback:
    get:
      operationId: handleGarminCallback
      description: handle the Garmin OAuth callback with code and state parameters
      tags:
        - GarminRegistration
      security: [ ]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: OAuth authorization code from Garmin
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State parameter for CSRF protection
      responses:
        '200':
          description: OAuth callback handled successfully
        '302':
          description: redirect after successful OAuth
          headers:
            Location:
              schema:
                type: string
              description: URL to redirect the user after successful OAuth
        '400':
          description: invalid or missing parameters
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'


  /config/study:
    get:
      operationId: getStudyConfiguration
      description: (re)load the study configuration
      tags:
        - Configuration
      responses:
        '200':
          $ref: 'BaseComponents.yaml#/components/responses/StudyInfoResponse'
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'

  /config/notifications:
    get:
      operationId: listPushNotificationServices
      description: list available push-notification services
      tags:
        - Configuration
      responses:
        '200':
          description: available push-notification services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PushNotificationServiceType'
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'

  /config/notifications/{serviceType}:
    parameters:
      - name: serviceType
        in: path
        schema:
          $ref: '#/components/schemas/PushNotificationServiceType'
        required: true
    get:
      operationId: getPushNotificationServiceClientConfig
      description: retrieve the client-configuration for the push-notification service
      tags:
        - Configuration
      responses:
        '200':
          description: the notification-service config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushNotificationConfig'
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'
    put:
      operationId: setPushNotificationToken
      description: store the client's push-notification token
      tags:
        - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushNotificationToken'
      responses:
        '202':
          description: notification-token updated
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'
        '404':
          description: unknown notification service
  /notifications:
    get:
      operationId: listPushNotifications
      tags:
        - Notifications
      responses:
        '200':
          description: return a list of all notifications for current participant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PushNotification'

  /notifications/{msgId}:
    delete:
      operationId: deleteNotification
      tags:
        - Notifications
      parameters:
        - name: msgId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: deleted successfully
        '400':
          description: not found

  /milestones:
    get:
      operationId: listMilestones
      tags:
        - Milestones
      responses:
        '200':
          $ref: '#/components/responses/ParticipantMilestoneListResponse'
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'

  /data/bulk:
    post:
      operationId: storeBulk
      description: add data to elastic shard
      tags:
        - Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataBulk'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'BaseComponents.yaml#/components/schemas/Id'
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'
  /applications/{applicationName}:
    get:
      operationId: getApplicationUrl
      description: Queries the URL for a desired application
      tags:
        - AppApplications
      parameters:
        - name: applicationName
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          $ref: '#/components/responses/ApplicationAccessUrlResponse'
        '401':
          $ref: 'BaseComponents.yaml#/components/responses/UnauthorizedApiKey'
        '404':
          description: application not found
components:
  schemas:
    PushNotification:
      description: a push notification
      type: object
      properties:
        type:
          type: string
          enum:
            - 'text'
            - 'data'
        msgId:
          type: string
        title:
          type: string
        body:
          type: string
        deepLink:
          type: string
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    AppConfiguration:
      description: |
        The configuration settings for the App while participating on a study
      type: object
      readOnly: true
      properties:
        endpoint:
          description: |
            base-uri of the App-API to use during the runtime of the study.
            
            If omitted, the client should stay with the current endpoint.
          type: string
          format: uri
        credentials:
          $ref: 'BaseComponents.yaml#/components/schemas/ApiKey'
      required:
        - credentials

    PushNotificationServiceType:
      description: available services for push-notification
      type: string
      enum:
        - FCM

    PushNotificationToken:
      type: object
      properties:
        token:
          type: string
          writeOnly: true

    PushNotificationConfig:
      type: object
      readOnly: true
      properties:
        service:
          $ref: '#/components/schemas/PushNotificationServiceType'
      required:
        - service
      discriminator:
        propertyName: service
        mapping:
          FCM: '#/components/schemas/FcmNotificationConfig'

    FcmNotificationConfig:
      description: configuration-settings for Firebase Cloud Messaging
      readOnly: true
      allOf:
        - $ref: '#/components/schemas/PushNotificationConfig'
        - type: object
          properties:
            projectId:
              description: The Google Cloud project ID
              type: string
            applicationId:
              description: The Google App ID that is used to uniquely identify an instance of an app.
              type: string
            apiKey:
              type: string
            databaseUrl:
              type: string
            gcmSenderId:
              description: The Project Number from the Google Developer's console
              type: string
            storageBucket:
              type: string
          readOnly: true
          externalDocs:
            url: https://firebase.google.com/docs/reference/android/com/google/firebase/FirebaseOptions

    DataBulk:
      type: object
      description: A bulk of observation data containing a unique id, the API Key of the participant and the array of observation data
      properties:
        bulkId:
          $ref: 'BaseComponents.yaml#/components/schemas/Id'
        dataPoints:
          type: array
          items:
            $ref: '#/components/schemas/ObservationData'
      required:
        - bulkId
        - dataPoints

    ObservationData:
      type: object
      properties:
        dataId:
          $ref: 'BaseComponents.yaml#/components/schemas/Id'
        observationId:
          type: string
          pattern: '^[\w-]+$'
          description: |
            The id of the observation. Unique within the context of the current study.
        instanceId:
          type: string
          description: |
            The id of the instance. Only present if the user can create multiple instance of the same observation
            and the sent data belongs to one specific of such instances.
        observationType:
          type: string
          pattern: '^[\w-]+$'
          description: the type of the observation
        dataType:
          type: string
          pattern: '^[\w-]+$'
          description: the type of the dataValue. Needed of a observation type defines data values of different types
        dataValue:
          type: object
          description: the data of the observation. A JSON object specific to the obserationType and/or dataType
        timestamp:
          type: string
          format: date-time
          description: the effective time when the observation was recorded
      required:
        - dataId
        - observationId
        - observationType
        - dataValue
        - timestamp

    GarminRedirect:
      type: object
      properties:
        code:
          type: string
        state:
          type: string
      required:
        - code
        - state

    ParticipantMilestone:
      type: object
      description: This shows the milestone of a single participant
      properties:
        participantMilestoneId:
          type: integer
        milestoneId:
          type: integer
        name:
          type: string
          readOnly: true
          description: The name of the referenced Milestone
        dateTime:
          type: string
          format: date-time
      required:
        - participantMilestoneId
        - milestoneId
        - name
        - dateTime

    Error:
      description: Generic Error
      type: object
      properties:
        code:
          type: string
        msg:
          type: string

    HtmlPage:
      description: HtmlRenderedPage

  parameters:
    RegistrationToken:
      name: More-Registration-Token
      in: header
      required: true
      schema:
        type: string
      description: The token to register for a study
    RegistrationTokenQuery:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: The registration token of a participant

  responses:
    NoSuchRegistrationToken:
      description: Invalid/Unknown Registration Token
    RegistrationTokenExpired:
      description: The provided registration token is expired or has already been used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RegistrationNotPossible:
      description: |
        Registration could not be completed:
        * the study currently does not accept new participants
        * `consent` was `false`
        * a **required** observation is not enabled/active
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ApplicationAccessUrlResponse:
      description: The URL to access the application
      content:
        application/json:
          schema:
            type: object
            properties:
              url:
                type: string

    ParticipantMilestoneListResponse:
      description: A list of participant milestones
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ParticipantMilestone'

  securitySchemes:
    apiKey:
      description: |
        Login with `apiId` as username and `apiKey` as password
      type: http
      scheme: basic
